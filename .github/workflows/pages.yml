# Publish board artifacts + rendered docs to GitHub Pages on every push to
# main. The build job runs inside the official KiCad image (KiCad 10 — see
# the container note below; the bench runs KiCad 9, which kicad-cli 10 reads
# without migration); scripts/build-site.sh is the single source of truth
# for what gets published and runs identically locally and here.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # 10.0.2: KiCad 9 Linux builds drop STEP model colors in GLB export
      # (every component rendered as one flat color); 10 reads them fine.
      # kicad-cli 10 reads the v9 board/schematic files without migration.
      image: kicad/kicad:10.0.2
      # The image's default user (kicad) can't write to the workspace mount
      options: --user root
    steps:
      # git must exist before checkout so it does a real clone (build-site.sh
      # needs `git ls-files` / `rev-parse`, which the tarball fallback breaks)
      - name: Install pandoc + git + node
        run: |
          apt-get update
          # gltf-transform CLI needs node >= 20; the kicad:10 image is
          # Debian 13 (trixie), whose distro nodejs is 20 — no nodesource
          apt-get install -y --no-install-recommends pandoc git nodejs npm
      - uses: actions/checkout@v4
      - name: Build site
        # safe.directory: the workspace mount is owned by the runner uid but
        # steps run as root, so git (used by build-site.sh) refuses it otherwise
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
