# Full validation suite — runs on every PR and on main. The local scripts
# (hardware-check.sh etc.) remain for fast bench feedback, but THIS is the
# authoritative gate: open a PR and watch CI; nothing needs to be run
# locally before merging.
#
# Jobs:
#   hardware  ERC + DRC (incl. schematic parity) vs hardware/ci-baseline.json,
#             netlist freshness (electrical partition check), BOM LCSC lint,
#             3D model path check, then regenerates the JLCPCB fab package
#             and uploads it as an artifact.
#   firmware  PlatformIO: native unit tests + ESP8266/ESP32 builds.
#   app       Web UI: typecheck, unit tests, build, Playwright e2e.
#   bom-report  Cost/stock telemetry from the JLCPCB API (non-gating).
#   pr-comment  Non-gating: one sticky comment per PR with board renders +
#             hardware/firmware/app/BOM stats, assembled from the facts
#             artifacts the jobs above upload. Renders are hosted on the
#             pr-assets branch so they embed in the comment.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware:
    runs-on: ubuntu-latest
    container:
      # Same image as pages.yml — the ERC/DRC baseline counts are tied to
      # this KiCad version; bump both together and refresh the baseline.
      image: kicad/kicad:10.0.2
      options: --user root
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - name: Install KiCad global library tables
        # The job runs as root, which has no KiCad config; without the global
        # sym/fp lib tables ERC drowns in ~170 bogus lib_symbol_issues /
        # footprint_link_issues ("configuration does not include library X")
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table \
             /usr/share/kicad/template/fp-lib-table \
             "$HOME/.config/kicad/10.0/"
      - name: Validate design (ERC, DRC, netlist, BOM, models)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/ci/hardware_validate.py --json hardware-facts.json
      - name: Stamp silk metadata from build commit
        # The committed board's silk git-stamp is baked on a dirty tree by
        # pcb_silk.py, so it reads "-dirty". Re-stamp from this clean checkout
        # so the rendered/fab assets show the exact build commit. Runs after
        # validation (which gates the committed file) and before any render.
        run: python3 scripts/stamp_silk.py
      - name: Render board for PR comment
        # Always, so a PR that fails ERC/DRC still shows the reviewer the
        # board. Default (non-raytraced) render at a comment-friendly size;
        # the high-quality fab renders live in the Pages deploy.
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p renders
          PCB=hardware/esp32-ir-remote.kicad_pcb
          kicad-cli pcb render --side top    -w 900 -h 700 -o renders/top.png    "$PCB"
          kicad-cli pcb render --side bottom -w 900 -h 700 -o renders/bottom.png "$PCB"
          kicad-cli pcb render --perspective --rotate ' -25,0,35' \
            -w 900 -h 700 -o renders/iso.png "$PCB"
      - name: Stage PR-comment inputs
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p _pr/renders
          cp hardware-facts.json _pr/ 2>/dev/null || true
          cp renders/*.png _pr/renders/ 2>/dev/null || true
      - name: Upload PR-comment inputs
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-hardware
          path: _pr/
          if-no-files-found: warn
      - name: Regenerate fab package
        run: python3 scripts/fab-outputs.py --skip-renders
      - name: Interactive HTML BOM (KiBot)
        # KiBot owns the hand-assembly interactive BOM. Gating preflights
        # (erc/drc) are skipped here — hardware_validate.py above is still the
        # authoritative gate; KiBot's gate migration is staged separately
        # (hardware/notes/validation-tooling.md). pip needs --no-compile (macros
        # quirk) + --break-system-packages (externally-managed image python).
        run: |
          apt-get install -y --no-install-recommends python3-pip
          pip3 install --no-compile --break-system-packages -q \
            kibot lxml requests pyyaml colorama qrcodegen InteractiveHtmlBom
          find /usr -path '*kibot*' -name '*.pyc' -delete 2>/dev/null || true
          IBOM=$(python3 -c "import InteractiveHtmlBom,os;print(os.path.dirname(InteractiveHtmlBom.__file__))")
          ln -sf "$IBOM/generate_interactive_bom.py" /usr/local/bin/generate_interactive_bom.py
          kibot -s erc,drc -c hardware/esp32-ir-remote.kibot.yaml \
            -e hardware/esp32-ir-remote.kicad_sch -b hardware/esp32-ir-remote.kicad_pcb \
            -d hardware/fab
      - name: Upload fab package
        uses: actions/upload-artifact@v4
        with:
          name: fab-package
          path: hardware/fab/
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        # intelhex: espressif32's vendored esptool.py imports it but doesn't
        # declare it; the ESP32 bootloader.bin step dies without it
        run: pip install platformio intelhex
      - name: Native unit tests
        run: pio test -e native
      - name: Build ESP8266 + ESP32-C3 firmware
        run: pio run -e nodemcuv2 -e esp32-c3 2>&1 | tee pio-build.log
      - name: Firmware size facts for PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          python3 scripts/ci/firmware_size.py pio-build.log firmware-facts.json || true
      - name: Upload firmware facts
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-facts
          path: firmware-facts.json
          if-no-files-found: warn
      - name: Python scripts compile check
        run: python3 -m compileall -q scripts analysis

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test 2>&1 | tee vitest.log
      - name: Build
        run: pnpm build
      - name: App facts for PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          python3 ../scripts/ci/app_facts.py vitest.log build/client app-facts.json || true
      - name: Upload app facts
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-facts
          path: app/app-facts.json
          if-no-files-found: warn
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/

  # Telemetry, not a gate: prices/stock move without code changes. The job
  # warns on low stock and archives a JSON snapshot per run, so cost history
  # is reconstructable from artifacts; the latest report ships on Pages.
  bom-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: BOM cost & stock report
        run: |
          mkdir -p _bom
          python3 scripts/ci/bom_report.py --boards 5 \
            --json _bom/bom-report.json --html _bom/bom-report.html
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: bom-report
          path: _bom/

  # Assemble a single sticky comment on every PR: board renders + hardware /
  # firmware / app / BOM stats, pulled from the facts artifacts the jobs above
  # upload. Runs even when an upstream job failed (always()) so reviewers still
  # get the board picture and whatever facts were produced. Each section
  # degrades to a "—" row if its facts file is missing.
  pr-comment:
    needs: [hardware, firmware, app, bom-report]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push renders to the pr-assets branch
      pull-requests: write      # create/update the sticky comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download facts + renders
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: _artifacts
      - name: Publish renders to pr-assets branch
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RENDER_DIR: _artifacts/pr-hardware/renders
        run: bash scripts/ci/publish_pr_assets.sh
      - name: Assemble comment
        run: |
          python3 scripts/ci/pr_report.py \
            --pcb hardware/esp32-ir-remote.kicad_pcb \
            --hardware _artifacts/pr-hardware/hardware-facts.json \
            --bom _artifacts/bom-report/bom-report.json \
            --firmware _artifacts/firmware-facts/firmware-facts.json \
            --app _artifacts/app-facts/app-facts.json \
            --renders-url "${{ steps.publish.outputs.renders_url }}" \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > comment.md
          cat comment.md
      - name: Post sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-board-report
          path: comment.md
