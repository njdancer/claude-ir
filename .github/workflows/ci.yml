name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Run type check
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    defaults:
      run:
        working-directory: viewer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: viewer/playwright-report/
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: e2e
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        working-directory: viewer
        run: pnpm install

      - name: Set deployment path
        id: deploy-path
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "path=" >> $GITHUB_OUTPUT
            echo "base=/claude-ir/" >> $GITHUB_OUTPUT
            echo "keep_files=false" >> $GITHUB_OUTPUT
          else
            # Extract branch name and sanitize for URL
            BRANCH="${{ github.ref_name }}"
            echo "path=previews/${BRANCH}" >> $GITHUB_OUTPUT
            echo "base=/claude-ir/previews/${BRANCH}/" >> $GITHUB_OUTPUT
            echo "keep_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Build for GitHub Pages
        working-directory: viewer
        env:
          VITE_BASE_PATH: ${{ steps.deploy-path.outputs.base }}
        run: pnpm build

      - name: Deploy to GitHub Pages (main)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./viewer/dist
          keep_files: false

      - name: Deploy to GitHub Pages (preview)
        if: github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./viewer/dist
          destination_dir: ${{ steps.deploy-path.outputs.path }}
          keep_files: true

      - name: Output preview URL
        if: github.ref != 'refs/heads/main'
        run: |
          echo "## 🚀 Preview Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Preview URL: https://${{ github.repository_owner }}.github.io${{ steps.deploy-path.outputs.base }}" >> $GITHUB_STEP_SUMMARY
