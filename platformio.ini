; PlatformIO Project Configuration File
;
; Environments:
;   nodemcuv2 - ESP8266 breadboard prototype (the original working setup)
;   esp32-c3  - ESP32-C3-WROOM-02 custom board v2 (native USB, pins per
;               hardware/notes/). Replaced the retired WROOM-32E esp32dev env.
;   native    - host-side unit tests (pio test -e native)

[platformio]
; native is test-only (pio test -e native); don't build it as firmware
default_envs = nodemcuv2, esp32-c3

[env]
framework = arduino
monitor_speed = 115200
monitor_filters =
    default
    time
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
build_flags =
    -D MONITOR_SPEED=115200
    -D SEND_BOSCH144=1
    -D SEND_COOLIX=1
    -D DECODE_BOSCH144=1
    -D DECODE_COOLIX=1

; ESP8266 breadboard: IR RX on GPIO14 (D5), IR TX on GPIO4 (D2) via 2N2222
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -D IR_LED_PIN=4
    -D IR_RECV_PIN=14
board_build.filesystem = littlefs

; ESP32-C3 custom board v2: native USB-Serial-JTAG console (no CH340 bridge),
; so flashing + monitor run straight over USB-C. IR TX GPIO5 (MOSFET driver,
; 4x TSAL6200 + D10 indicator), IR RX GPIO6 (TSOP38238), AHT20 temp/humidity
; on I2C SDA GPIO7 / SCL GPIO10 (shared with the Qwiic header), user LEDs
; GPIO3/4 (blue, via 2N7002 low-side from 5V). See hardware/notes/README.md.
[env:esp32-c3]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D IR_LED_PIN=5
    -D IR_RECV_PIN=6
    -D USER_LED1_PIN=3
    -D USER_LED2_PIN=4
    -D I2C_SDA_PIN=7
    -D I2C_SCL_PIN=10

; Native testing environment (runs on host machine, no hardware)
[env:native]
framework =
lib_deps =
platform = native
build_flags =
    -std=c++11
    -D UNIT_TEST
test_build_src = no
