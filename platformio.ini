; PlatformIO Project Configuration File
;
; Environments:
;   nodemcuv2 - ESP8266 breadboard prototype (the original working setup)
;   esp32dev  - ESP32-WROOM-32E custom dev board (pins per hardware/notes/)
;   native    - host-side unit tests (pio test -e native)

[platformio]
; native is test-only (pio test -e native); don't build it as firmware
default_envs = nodemcuv2, esp32dev

[env]
framework = arduino
monitor_speed = 115200
monitor_filters =
    default
    time
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.8.6
build_flags =
    -D MONITOR_SPEED=115200
    -D SEND_BOSCH144=1
    -D SEND_COOLIX=1
    -D DECODE_BOSCH144=1
    -D DECODE_COOLIX=1

; ESP8266 breadboard: IR RX on GPIO14 (D5), IR TX on GPIO4 (D2) via 2N2222
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -D IR_LED_PIN=4
    -D IR_RECV_PIN=14
board_build.filesystem = littlefs

; ESP32 custom dev board: IR TX GPIO18 (MOSFET driver), IR RX GPIO19,
; DHT22 GPIO4, user LEDs GPIO16/17 (see hardware/notes/README.md)
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D IR_LED_PIN=18
    -D IR_RECV_PIN=19
    -D USER_LED1_PIN=16
    -D USER_LED2_PIN=17

; Native testing environment (runs on host machine, no hardware)
[env:native]
framework =
lib_deps =
platform = native
build_flags =
    -std=c++11
    -D UNIT_TEST
test_build_src = no
