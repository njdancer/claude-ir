# KiBot config — validation gate + assembly artifacts for the ESP32 IR board.
# Run: kibot -c hardware/esp32-ir-remote.kibot.yaml \
#        -e hardware/esp32-ir-remote.kicad_sch -b hardware/esp32-ir-remote.kicad_pcb
#
# Owns the ERC/DRC/schematic-parity gate (the modern kicad-cli engine; loads the
# project design rules automatically) and the InteractiveHtmlBom hand-assembly
# artifact. The DRC/ERC preflights fail on ERRORS (unconnected, shorts,
# clearance, keepout); benign KiCad *warning* classes are filtered below so the
# report shows only actionable items. Fab outputs (gerbers/drill/CPL/BOM) + the
# CPL rotation table currently stay in scripts/fab-outputs.py. A KiBot CPL/BOM
# (esp32-ir-remote-fab.kibot.yaml) + cross-check (scripts/ci/cpl_crosscheck.py,
# gating in CI) now prove KiBot's position+rot_footprint+bom match
# fab-outputs.py exactly (rotations mod 360 + designator->LCSC), so the cutover
# is de-risked. KiBot ships NO built-in rotation DB — both engines are fed our
# OWN reviewed values (see validation-tooling.md).
kibot:
  version: 1

preflight:
  erc:
    enabled: true
    dont_stop: false
  drc:
    enabled: true
    schematic_parity: true
    dont_stop: false
    # Benign warning classes we accept — filtered so a NEW warning stands out.
    # Narrow on purpose: only board-only mounting-hole/logo "extra footprint"
    # (never in the netlist) and the inherent J2 USB-C silk-vs-edge clip (the
    # edge-overhang connector). Real parity mismatches are NOT filtered. The
    # lib_symbol/footprint_link noise is env-only (missing global lib tables)
    # and absent in CI, so it needs no filter.
    filters:
      - filter: 'Board-only mounting holes + Claude logo (not in netlist)'
        error: 'extra_footprint'
        regex: 'Footprint (H[0-9]+|REF\*\*)'
      - filter: 'Inherent USB-C edge-overhang silk clip'
        error: 'silk_edge_clearance'
        regex: '.*'
  # Fail if any copper zone's fill is stale vs the board (our pipeline pours
  # GND then the LDO thermal pour; a stale fill reaching fab is a real risk).
  check_zone_fills: true
  # Export a BoM XML so the interactive BOM can show the LCSC field.
  update_xml:
    enabled: true

outputs:
  - name: ibom
    comment: "Interactive HTML BOM for hand assembly"
    type: ibom
    dir: fab
    options:
      extra_fields: 'LCSC'
      netlist_file: 'hardware/esp32-ir-remote.xml'
