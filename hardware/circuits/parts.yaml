# Parts mapping for ESP32 IR Remote Control board
# Maps component types to KiCad symbols and footprints

# Passives (0805 default for hand soldering)
resistor:
  symbol: Device:R
  footprint: Resistor_SMD:R_0805_2012Metric

capacitor:
  symbol: Device:C
  footprint: Capacitor_SMD:C_0805_2012Metric

inductor:
  symbol: Device:L
  footprint: Inductor_SMD:L_6.7x6.7_H3.0

# Protection devices
polyfuse:
  symbol: Device:Polyfuse
  footprint: Fuse:Fuse_1812_4532Metric

tvs_diode:
  symbol: Device:D_TVS
  footprint: Diode_SMD:D_SMB

# Connectors
usb_c_receptacle_14p:
  symbol: Connector:USB_C_Receptacle_USB2.0_14P
  footprint: Connector_USB:USB_C_Receptacle_GCT_USB4085

esp32_breakout_header:
  symbol: Connector:Conn_02x19_Odd_Even
  footprint: Connector_PinHeader_2.54mm:PinHeader_2x19_P2.54mm_Vertical

jumper_2_open:
  symbol: Jumper:Jumper_2_Open
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical

switch_momentary:
  symbol: Switch:SW_Push
  footprint: Button_Switch_THT:SW_PUSH_6mm

# ICs
ap63203:
  symbol: Regulator_Switching:AP63203
  footprint: Package_TO_SOT_SMD:TSOT-23-6

ch340c:
  symbol: Interface_USB:CH340C
  footprint: Package_SO:SOIC-16_3.9x9.9mm_P1.27mm

esp32_wroom_32e:
  symbol: RF_Module:ESP32-WROOM-32E
  footprint: RF_Module:ESP32-WROOM-32D

# Transistors
npn_transistor:
  symbol: Transistor_BJT:2N2222
  footprint: Package_TO_SOT_THT:TO-92_Inline

nmos:
  symbol: Transistor_FET:BSS138
  footprint: Package_TO_SOT_SMD:SOT-23

# LEDs
led:
  symbol: Device:LED
  footprint: LED_THT:LED_D3.0mm

ir_led:
  symbol: Device:LED
  footprint: LED_THT:LED_D5.0mm

# Sensors
ir_receiver:
  symbol: Interface_Optical:TSOP382xx
  footprint: OptoDevice:Vishay_MINICAST-3Pin

dht22:
  symbol: Sensor:DHT22_AM2302
  footprint: Sensor:ASAIR_AM2302_P2.54mm_Vertical
